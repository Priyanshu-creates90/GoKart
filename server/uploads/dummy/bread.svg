<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_breadsvg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="400" height="400" rx="28" fill="url(#grad_breadsvg)" />
  <circle cx="200" cy="160" r="80" fill="#ffffff" fill-opacity="0.18" filter="url(#shadow)" />
  <text x="200" y="195" font-size="76" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">🍞</text>
  <text x="200" y="295" font-size="22" font-weight="700" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Multigrain Bread</text>
  <text x="200" y="328" font-size="14" font-weight="500" text-anchor="middle" fill="#f8fafc" fill-opacity="0.9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">400g • Whole Wheat</text>
</svg>